<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap');
      .bg { fill: #FAFAF8; }
      .border { fill: none; stroke: #E5E4DE; stroke-width: 2; }
      .badge-bg { fill: #F4F3EE; stroke: #E5E4DE; stroke-width: 1; }
      .badge-text { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; fill: #6B7280; letter-spacing: 0.08em; }
      .title { font-family: 'Fraunces', serif; font-size: 72px; font-weight: 400; fill: #15171C; letter-spacing: -0.02em; }
      .title-italic { font-style: italic; fill: #2A3EE0; }
      .subtitle { font-family: 'IBM Plex Sans', sans-serif; font-size: 24px; font-weight: 400; fill: #383D48; }
      .mono-meta { font-family: 'IBM Plex Mono', monospace; font-size: 16px; fill: #6B7280; }
      .cobalt-dot { fill: #2A3EE0; }
    </style>
  </defs>

  <!-- Background Paper -->
  <rect class="bg" width="1200" height="630"/>
  <rect class="border" x="24" y="24" width="1152" height="582" rx="16"/>

  <!-- Top Badge -->
  <g transform="translate(80, 80)">
    <rect class="badge-bg" x="0" y="0" width="168" height="36" rx="6"/>
    <circle class="cobalt-dot" cx="20" cy="18" r="4"/>
    <text class="badge-text" x="34" y="23">v3.2.0 RELEASE</text>
  </g>

  <!-- Main Headline -->
  <text class="title" x="80" y="240">Kenneth Torcuator</text>
  <text class="title" x="80" y="320">Software Engineer</text>

  <!-- Subtitle -->
  <text class="subtitle" x="80" y="400">I build software that <tspan class="title-italic">works so well</tspan> you forget it's there.</text>

  <!-- Divider Line -->
  <line x1="80" y1="460" x2="1120" y2="460" stroke="#E5E4DE" stroke-width="1.5"/>

  <!-- Footer Metadata -->
  <g transform="translate(80, 520)">
    <text class="mono-meta" x="0" y="0">Spring Boot 3.4  •  Next.js 16  •  FastAPI  •  Clerk  •  PostgreSQL</text>
    <text class="mono-meta" x="1040" y="0" text-anchor="end">Metro Manila, PH</text>
  </g>
</svg>
